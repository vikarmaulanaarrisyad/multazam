---
deployment:
  tasks:
    # 1. Atur path Node.js (Pastikan versi 20 sesuai dengan yang Anda gunakan di cPanel)
    - export PATH=/opt/cpanel/ea-nodejs20/bin:$PATH
    
    # 2. Salin semua file dari Git ke folder tujuan di luar public_html
    - /bin/cp -R * ~/aplikasi-nextjs
    
    # 3. Masuk ke folder aplikasi-nextjs, lalu jalankan install dependencies
    - cd ~/aplikasi-nextjs && npm install
    
    # 4. Generate Prisma
    - cd ~/aplikasi-nextjs && npx prisma generate
    
    # 5. Build Next.js ke mode standalone
    - cd ~/aplikasi-nextjs && npm run build
    
    # 6. Pindahkan folder public dan static ke dalam folder standalone
    - cd ~/aplikasi-nextjs && cp -r public .next/standalone/
    - cd ~/aplikasi-nextjs && cp -r .next/static .next/standalone/.next/
    
    # 7. Trigger restart Phusion Passenger (cPanel Node.js App)
    - cd ~/aplikasi-nextjs && mkdir -p tmp && touch tmp/restart.txt